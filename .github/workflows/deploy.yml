name: Deploy Thang Phu Mini App

on:
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.THANGPHU_DEPLOY_ENABLED == 'true' }}
    environment: thangphu
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.THANGPHU_VPS_HOST }}
          username: deploy
          key: ${{ secrets.THANGPHU_VPS_DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /var/www/thangphu
            git pull origin main

            cd MiniApp
            npm ci
            npm run build
            pm2 restart thangphu

            cd ../Backend
            npm ci --omit=dev
            pm2 restart thangphu-backend

            cd ../Frontend/AdminWeb
            npm ci
            npm run build
